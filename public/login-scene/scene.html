<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>山笺</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="day-start.webp" fetchpriority="high">
<link rel="preload" as="image" href="day-thumbnail.webp" fetchpriority="high">
<style>
  :root {
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", "Times New Roman", serif;
    --ink: #303e35;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: var(--ink);
    font-family: var(--serif);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: transparent;
  }

  .stage {
    position: fixed;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background-color: transparent;
    background-image: url("day-start.webp"), url("day-thumbnail.webp");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    pointer-events: none;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #painting {
    opacity: 0;
    transition: opacity 220ms ease-out;
  }

  #painting[data-ready="true"] {
    opacity: 1;
  }

  #burn,
  #dusk {
    visibility: hidden;
  }

  #burn {
    z-index: 5;
  }

  #dusk {
    z-index: 6;
    object-fit: cover;
  }

  [data-phase="burning"] #burn,
  [data-phase="dusk"][data-show-dusk] #dusk {
    visibility: visible;
  }

  #motionToggle,
  #motionStatus {
    display: none !important;
  }

  @media (prefers-reduced-motion: reduce) {
    #painting {
      transition: none;
    }
  }
</style>
</head>
<body>
  <main class="stage" data-phase="day" aria-hidden="true">
    <canvas id="painting" class="scene"></canvas>
    <canvas id="burn" class="scene"></canvas>
    <img id="dusk" class="scene" src="dusk.webp" alt="">
    <button class="motion-toggle" id="motionToggle" type="button" aria-label="暂停动效" data-state="playing" hidden>
      <span class="motion-toggle__text">暂停</span>
    </button>
    <p id="motionStatus" role="status" aria-live="polite" hidden></p>
  </main>

  <script src="landscape-shader.js"></script>
  <script src="landscape.js"></script>
  <script src="paper-burn.js"></script>
  <script src="scene.js"></script>
</body>
</html>
